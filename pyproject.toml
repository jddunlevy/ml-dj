[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mldj"
version = "0.1.0"
description = "Teardown and redesign of Spotify's AI DJ: a session-adaptive recommender over a Last.fm folksonomy tag space"
requires-python = ">=3.12"
# Phase 0 had no runtime dependencies. numpy and scipy arrive with Phase 1's semantic
# space: PPMI over a sparse tags x items matrix and a truncated SVD are not things to
# hand-roll. Nothing else is justified yet, and the live client stays dependency-free.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
mldj = "mldj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
